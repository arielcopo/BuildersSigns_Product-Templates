<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Product</title>
  
  <!-- Link Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Basic reset and centering */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 96px;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    /* --- Header Styles --- */
    .main-header {
      width: 100%;
      height: 96px;
      border-bottom: 1px solid #E5E5E5;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 0 20px;
      margin-bottom: 64px;
    }

    .header-inner {
      width: 100%;
      max-width: 1216px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-logo {
      width: 201px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* --- Main Container --- */
    .onboarding-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 64px; /* Space between title and the cards grid */
      padding: 0 20px;
      width: 100%;
    }

    /* Title Styling */
    .title {
      color: #171717;
      font-size: 30px;
      font-weight: 600;
      line-height: 38px;
      margin: 0;
    }

    /* --- Cards Grid Layout --- */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 inline columns on desktop */
      gap: 32px; /* 32px gap between columns */
      width: 100%;
      max-width: 1216px; /* Total combined max width */
      justify-items: center; /* Centers the fixed-width cards within their grid cells */
    }

    /* Card Styling (Mapped from your exact inline styles) */
    .card-item {
      width: 384px; /* Fixed size width */
      max-width: 100%; /* Safety precaution for very small screens */
      background-color: #FAFAFA;
      border-radius: 16px;
      border: 1px solid #E5E5E5; /* Replaces outline for cleaner rendering */
      padding: 22px 2px 36px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-decoration: none; 
      transition: background-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .card-item:hover {
      background-color: #F0F0F0; /* Subtle hover effect */
      transform: translateY(-4px);
    }

    .card-image {
      width: 100%;
      max-width: 380px;
      height: 244px;
      border-radius: 16px;
      object-fit: cover;
    }

    .card-text {
      color: #171717;
      font-size: 20px;
      font-weight: 600;
      line-height: 30px;
      margin: 0;
      text-align: center;
      word-wrap: break-word;
    }

    /* --- Responsive Adjustments --- */
    
    /* Tablet layout */
    @media (max-width: 960px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr); /* Switch to 2 columns */
      }
    }

    /* Mobile layout */
    @media (max-width: 630px) {
      .main-header {
        height: auto;
        padding: 20px;
        margin-bottom: 40px;
      }
      .title {
        font-size: 24px;
      }
      .cards-grid {
        grid-template-columns: 1fr; /* Switch to 1 column */
      }
      .card-image {
        height: auto; /* Becomes responsive on height for mobile */
        aspect-ratio: 380 / 244; /* Maintains the original image proportions */
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="header-inner">
      <div class="header-logo">
        <img src="https://mlqlsvcjggrx.i.optimole.com/w:201/h:42/q:mauto/f:best/ig:avif/https://builderssigns.com.au/wp-content/uploads/2026/06/Dark-and-Yellow-Landscape-2.svg" alt="Builders Signs Logo">
      </div>
    </div>
  </header>

  <!-- Top Content -->
  <div class="onboarding-container">
    <h1 class="title">Select Product <br/> Templates</h1>

    <!-- 3 Column Cards Grid -->
    <div class="cards-grid">
      
      <!-- Card 1: Banner Mesh -->
      <a href="BannerMeshTemplates/page1_bm.html" class="card-item">
        <img class="card-image" src="https://builderssigns.com.au/wp-content/uploads/2026/07/Banner-Mesh-Templates.png" alt="Banner Mesh">
        <h2 class="card-text">Banner Mesh</h2>
      </a>

      <!-- Card 2: Branding Corflute -->
      <a href="BrandingCorfluteTemplates/page1_bc.html" class="card-item">
        <img class="card-image" src="https://builderssigns.com.au/wp-content/uploads/2026/07/Branding-Corflutes-Templates.png" alt="Branding Corflute">
        <h2 class="card-text">Branding Corflute</h2>
      </a>

      <!-- Card 3: Compliance Corflute -->
      <a href="ComplianceCorfluteTemplates/page1_cc.html" class="card-item">
        <img class="card-image" src="https://builderssigns.com.au/wp-content/uploads/2026/07/Compliance-Corflutes-Templates.png" alt="Compliance Corflute">
        <h2 class="card-text">Compliance Corflute</h2>
      </a>

    </div>
  </div>

</body>
</html>
